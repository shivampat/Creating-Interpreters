name: Java CI for jlox with Maven

on:
  push:
    paths:
      - 'jlox/**'

jobs:
  build-jlox-and-run-tests:
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: ./jlox
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 17 env
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('java-project/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build and test jlox tests
        run: mvn clean test